<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Toko Buku Online</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>Toko Buku Online</h1>
        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="stok.html">Katalog Buku</a>
            <a href="checkout.html">Pemesanan</a>
            <a href="tracking.html">Tracking</a>
            <a href="index.html">Logout</a>
        </nav>
    </header>

    <main class="container">

        <section class="card">
            <h2>Form Pemesanan Buku</h2>

            <form id="formCheckout">

                <label>Nama Pemesan</label>
                <input type="text" id="namaPemesan" required>

                <label>Email</label>
                <input type="email" id="emailPemesan" required>

                <label>Nomor Telepon</label>
                <input type="tel" id="telepon" required>

                <label>Alamat Pengiriman</label>
                <input type="text" id="alamat" required>

                <label>Pilih Buku</label>
                <select id="pilihBuku" required>
                    <option value="">-- Pilih Buku --</option>
                </select>

                <label>Jumlah Buku</label>
                <input type="number" id="jumlah" min="1" value="1" required>

                <label>Metode Pembayaran</label>
                <select id="pembayaran" required>
                    <option value="">-- Pilih Pembayaran --</option>
                    <option value="Transfer Bank">Transfer Bank</option>
                    <option value="COD">COD</option>
                    <option value="E-Wallet">E-Wallet</option>
                </select>

                <h3 id="totalHarga">Total: Rp 0</h3>

                <br>
                <button type="submit">Buat Pesanan</button>

            </form>
        </section>

        <section class="card">
            <h2>Daftar Pemesanan</h2>

            <table>
                <thead>
                    <tr>
                        <th>Nama</th>
                        <th>Buku</th>
                        <th>Jumlah</th>
                        <th>Total</th>
                        <th>Pembayaran</th>
                    </tr>
                </thead>
                <tbody id="tabelPesanan"></tbody>
            </table>
        </section>

    </main>

    <footer>
        <p>&copy;  2026 Toko Buku Online. Semua Hak Dilindungi</p>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/script.js"></script>

</body>
</html>
